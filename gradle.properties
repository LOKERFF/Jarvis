org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# OPTIONAL CONFIG (Phase 1)
# Paste values here, then press "Sync Project with Gradle Files".
# ---------------------------------------------------------------------------
# Google OAuth *Web* client ID (used by Google Sign-In).
# Create it in Google Cloud Console > APIs & Services > Credentials >
# "OAuth client ID" > type "Web application".
# The Android SHA-1 of your signing key must be added to the same project.
jarvisGoogleWebClientId=

# Play Integrity Cloud project number (digits only, from Google Cloud Console).
# Leave empty to skip the cloud-project binding; the app then reports the
# honest result "Not verified, limited mode".
jarvisPlayIntegrityProjectNumber=
