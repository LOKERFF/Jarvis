name: Publish Prebuilt APK Release

# Release-only workflow for prebuilt APKs committed into apk-distribution/.
# Automated compilation runs in .github/workflows/build-apk.yml (Release tag: v2).

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apk-distribution/*.apk'
      - 'apk-distribution/*.sha256'
      - '.github/workflows/publish-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Prebuilt APK (v2)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate prebuilt APK
        run: |
          set -euo pipefail
          APK_PATH="$(find apk-distribution -maxdepth 1 -name '*.apk' | head -n1 || true)"
          if [ -z "$APK_PATH" ]; then
            echo "::notice title=Nothing to publish::No prebuilt APK in apk-distribution/. Automated release builds run in build-apk.yml."
            echo "SKIP_PUBLISH=true" >> "$GITHUB_ENV"
            {
              echo "## No prebuilt APK committed"
              echo ""
              echo "Use the **Build Jarvis v2 Release APK** workflow (\`.github/workflows/build-apk.yml\`) to compile and publish \`$RELEASE_TAG\` automatically."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "SKIP_PUBLISH=false" >> "$GITHUB_ENV"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "SUM_PATH=${APK_PATH}.sha256" >> "$GITHUB_ENV"

      - name: Validate prebuilt APK and SHA-256
        if: env.SKIP_PUBLISH != 'true'
        run: |
          set -euo pipefail
          [ -s "$APK_PATH" ] || { echo "::error::$APK_PATH is empty"; exit 1; }
          [ -f "$SUM_PATH" ] || { echo "::error::Missing checksum at $SUM_PATH"; exit 1; }

          EXPECTED="$(grep -Eo '^[0-9a-fA-F]{64}' "$SUM_PATH" | head -n1 | tr 'A-F' 'a-f')"
          [ -n "$EXPECTED" ] || { echo "::error::Invalid SHA-256 checksum in $SUM_PATH"; exit 1; }
          ACTUAL="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "::error::Checksum mismatch: $EXPECTED != $ACTUAL"; exit 1; }

          unzip -tq "$APK_PATH" > /dev/null
          SIZE="$(stat -c%s "$APK_PATH")"
          echo "APK_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "APK_SHA=$ACTUAL" >> "$GITHUB_ENV"

      - name: Publish or update GitHub Release (v2)
        if: env.SKIP_PUBLISH != 'true'
        run: |
          set -euo pipefail
          NOTES="Jarvis $RELEASE_TAG prebuilt APK from commit $GITHUB_SHA. SHA-256: $APK_SHA"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" "$SUM_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Jarvis $RELEASE_TAG" \
              --notes "$NOTES" \
              --latest
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" "$SUM_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Jarvis $RELEASE_TAG" \
              --notes "$NOTES" \
              --latest
          fi

      - name: Job summary
        if: env.SKIP_PUBLISH != 'true'
        run: |
          set -euo pipefail
          SIZE_MB="$(awk -v b="$APK_SIZE" 'BEGIN { printf "%.2f", b / 1048576 }')"
          APK_NAME="$(basename "$APK_PATH")"
          {
            echo "## Prebuilt APK published ($RELEASE_TAG)"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Release Tag | \`$RELEASE_TAG\` |"
            echo "| File | \`$APK_NAME\` |"
            echo "| Size | $APK_SIZE bytes ($SIZE_MB MB) |"
            echo "| SHA-256 | \`$APK_SHA\` |"
            echo "| Direct Download | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$APK_NAME |"
          } >> "$GITHUB_STEP_SUMMARY"
