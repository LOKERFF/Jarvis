name: Build Debug APK

# Compiles the app on a GitHub-hosted runner (JDK 17 + Android SDK 35), verifies
# the produced APK and publishes it as a GitHub Release asset.
#
# This is the ONLY workflow that runs Gradle. publish-apk.yml stays release-only.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish debug APK
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$APK" ]; then
            echo "::error::Build finished but $APK is missing"
            exit 1
          fi
          if [ ! -s "$APK" ]; then
            echo "::error::$APK is empty"
            exit 1
          fi
          unzip -tq "$APK" > /dev/null
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          echo "APK_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "APK_SHA=$SHA" >> "$GITHUB_ENV"
          echo "Verified APK: $SIZE bytes, sha256 $SHA"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          mkdir -p release-out
          cp app/build/outputs/apk/debug/app-debug.apk release-out/app-debug.apk
          printf '%s  app-debug.apk\n' "$APK_SHA" > release-out/app-debug.apk.sha256

          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi

          gh release create "$TAG" \
            release-out/app-debug.apk \
            release-out/app-debug.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Jarvis debug APK $TAG" \
            --notes "Debug APK compiled by GitHub Actions from commit $GITHUB_SHA. SHA-256: $APK_SHA" \
            --latest

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Job summary
        run: |
          set -euo pipefail
          SIZE_MB="$(awk -v b="$APK_SIZE" 'BEGIN { printf "%.2f", b / 1048576 }')"
          {
            echo "## Debug APK built and published"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Tag | \`$RELEASE_TAG\` |"
            echo "| Size | $APK_SIZE bytes ($SIZE_MB MB) |"
            echo "| SHA-256 | \`$APK_SHA\` |"
            echo "| Release | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG |"
            echo "| Direct download | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest/download/app-debug.apk |"
          } >> "$GITHUB_STEP_SUMMARY"
